name = "mailflare"
main = "./worker.ts"
compatibility_date = "2026-05-20"
keep_vars = true
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
binding = "ASSETS"
not_found_handling = "none"

[images]
binding = "IMAGES"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "mailflare"

[durable_objects]
bindings = [
  { name = "REALTIME", class_name = "RealtimeHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

[triggers]
crons = ["0 2 * * *", "*/5 * * * *"]

[[ratelimits]]
name = "LOGIN_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "AGENT_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[observability]
enabled = true

upload_source_maps = true

[[send_email]]
name = "EMAIL"
remote = false

[ai]
binding = "AI"
remote = true

[[d1_databases]]
binding = "DB"
database_name = "mailflare"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mailflare-raw"

[[queues.producers]]
binding = "INBOUND_QUEUE"
queue = "mailflare-inbound"

[[queues.producers]]
binding = "OUTBOUND_QUEUE"
queue = "mailflare-outbound"

[[queues.producers]]
binding = "AGENT_QUEUE"
queue = "mailflare-agent"

[[queues.consumers]]
queue = "mailflare-inbound"
max_batch_size = 5
max_retries = 3

[[queues.consumers]]
queue = "mailflare-outbound"
max_batch_size = 5
max_retries = 3

[[queues.consumers]]
queue = "mailflare-agent"
max_batch_size = 1
max_retries = 3
